<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مؤسسة الرسالة للتعليم الخصوصي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .brand-container { display: flex; flex-direction: column; text-decoration: none; }
        .logo { font-size: 18px; font-weight: 900; color: #0284c7; }
        .sub-logo { font-size: 10px; font-weight: 600; color: #64748b; text-transform: uppercase; }

        .menu-toggle { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: #0284c7; }
        .nav-menu { display: flex; list-style: none; gap: 20px; align-items: center; }
        .nav-menu a { text-decoration: none; color: #475569; font-weight: 600; font-size: 14px; }

        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border-top: 4px solid #0284c7; }
        .login-card h2 { font-size: 22px; color: #1e293b; margin-bottom: 8px; text-align: center; }
        .login-card p { font-size: 13px; color: #64748b; margin-bottom: 25px; text-align: center; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #334155; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        
        .login-btn { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .login-btn:hover { background: #0369a1; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .nav-menu { display: none; flex-direction: column; width: 100%; background: white; position: absolute; top: 70px; left: 0; padding: 20px; box-shadow: 0 5px 10px rgba(0,0,0,0.05); }
            .nav-menu.active { display: flex; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand-container">
            <div class="logo">مؤسسة الرسالة</div>
            <div class="sub-logo">للتعليم الخصوصي</div>
        </a>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <ul class="nav-menu" id="navMenu">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="register.html">التسجيل القبلي</a></li>
        </ul>
    </header>

    <div class="container">
        <div class="login-card">
            <h2>تسجيل الدخول للمنصة</h2>
            <p>أدخل بيانات الحساب أو اختر الفضاء مباشرة للتجربة</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" required value="admin@alrisala.ma" placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required value="123456" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>اختر الفضاء المستهدف</label>
                    <select id="role">
                        <option value="admin">فضاء الإدارة</option>
                        <option value="teacher">فضاء الأساتذة</option>
                        <option value="parent">فضاء أولياء الأمور</option>
                        <option value="student">فضاء التلميذ</option>
                    </select>
                </div>
                <button type="submit" class="login-btn">دخول إلى الفضاء</button>
            </form>
        </div>
    </div>

    <script>
        function toggleMenu() { document.getElementById('navMenu').classList.toggle('active'); }
        document.querySelectorAll('.nav-menu a').forEach(l => l.addEventListener('click', () => document.getElementById('navMenu').classList.remove('active')));

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const role = document.getElementById('role').value;
            localStorage.setItem('user_role', role);

            switch(role) {
                case 'admin': window.location.href = 'admin.html'; break;
                case 'teacher': window.location.href = 'teacher.html'; break;
                case 'parent': window.location.href = 'parent.html'; break;
                case 'student': window.location.href = 'student.html'; break;
            }
        });
    </script>
</body>
</html>
