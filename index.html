<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b3b68">
    <meta name="description" content="مؤسسة الرسالة للتعليم الخصوصي - منصة إلكترونية تربوية متكاملة">
    <title data-ar="مؤسسة الرسالة للتعليم الخصوصي" data-fr="Groupe Scolaire Al Risala">مؤسسة الرسالة للتعليم الخصوصي</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root{
            --navy:#073b6b;
            --navy-2:#0b568f;
            --blue:#0ea5e9;
            --gold:#d9a72d;
            --gold-light:#f5d77a;
            --green:#0f9d78;
            --purple:#7357d8;
            --ink:#10243b;
            --muted:#64748b;
            --bg:#f6f9fc;
            --white:#fff;
            --border:rgba(7,59,107,.10);
            --shadow:0 18px 55px rgba(7,59,107,.12);
            --radius:22px;
        }

        *{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth}
        body{
            font-family:'Cairo',sans-serif;
            color:var(--ink);
            background:var(--bg);
            overflow-x:hidden;
        }
        a{text-decoration:none;color:inherit}
        button{font-family:inherit}

        /* ===== الخلفية الرئيسية: الصورة المرفقة بإظهار خفيف ===== */
        .page-bg{
            position:fixed;
            inset:0;
            z-index:-3;
            background:
                linear-gradient(180deg,rgba(246,249,252,.82),rgba(246,249,252,.94)),
                url("arrissalahimg3.png") center/cover no-repeat;
            filter:saturate(.88);
        }
        .page-bg::after{
            content:"";
            position:absolute;
            inset:0;
            background:
                radial-gradient(circle at 10% 15%,rgba(14,165,233,.10),transparent 28%),
                radial-gradient(circle at 90% 70%,rgba(15,157,120,.08),transparent 28%);
        }

        /* ===== الهيدر ===== */
        header{
            position:sticky;
            top:0;
            z-index:1000;
            background:rgba(255,255,255,.88);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            border-bottom:1px solid rgba(7,59,107,.08);
            box-shadow:0 5px 25px rgba(7,59,107,.06);
        }
        .header-inner{
            max-width:1250px;
            margin:auto;
            min-height:76px;
            padding:10px 24px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:25px;
        }
        .brand{
            display:flex;
            align-items:center;
            gap:12px;
            min-width:max-content;
        }
        .brand-logo{
            width:52px;height:52px;
            object-fit:contain;
            border-radius:14px;
            background:#fff;
            padding:4px;
            box-shadow:0 7px 18px rgba(7,59,107,.10);
        }
        .brand-name{
            font-weight:900;
            color:var(--navy);
            font-size:17px;
            line-height:1.2;
        }
        .brand-sub{
            color:var(--muted);
            font-size:10px;
            font-weight:700;
            letter-spacing:.4px;
            margin-top:2px;
        }

        .nav{
            display:flex;
            align-items:center;
            gap:5px;
            list-style:none;
        }
        .nav a{
            display:flex;
            align-items:center;
            gap:7px;
            padding:10px 13px;
            color:#40546b;
            font-size:13px;
            font-weight:700;
            border-radius:12px;
            transition:.25s ease;
        }
        .nav a:hover,.nav a.active{
            color:var(--navy);
            background:#edf6fc;
        }
        .nav a.active{box-shadow:inset 0 -2px var(--gold)}

        .lang-btn{
            border:1px solid #d8e2eb;
            background:#fff;
            color:var(--navy);
            padding:9px 13px;
            border-radius:12px;
            font-size:12px;
            font-weight:800;
            cursor:pointer;
            transition:.25s;
        }
        .lang-btn:hover{border-color:var(--blue);transform:translateY(-1px)}

        .menu-toggle{
            display:none;
            width:44px;height:44px;
            border:0;
            border-radius:12px;
            background:#edf6fc;
            color:var(--navy);
            font-size:22px;
            cursor:pointer;
        }

        /* ===== Hero ===== */
        .hero-wrap{
            position:relative;
            min-height:650px;
            display:flex;
            align-items:center;
            padding:70px 24px 55px;
        }
        .hero-wrap::before{
            content:"";
            position:absolute;
            inset:0;
            background:
                linear-gradient(90deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.89) 35%,rgba(255,255,255,.36) 72%,rgba(255,255,255,.12) 100%);
            z-index:-1;
        }
        [dir="rtl"] .hero-wrap::before{
            background:
                linear-gradient(270deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.89) 35%,rgba(255,255,255,.36) 72%,rgba(255,255,255,.12) 100%);
        }

        .hero{
            width:min(1250px,100%);
            margin:auto;
            display:grid;
            grid-template-columns:1.05fr .95fr;
            align-items:center;
            gap:45px;
        }
        .hero-copy{max-width:650px}
        .eyebrow{
            display:inline-flex;
            align-items:center;
            gap:9px;
            padding:7px 13px;
            background:rgba(255,255,255,.78);
            border:1px solid rgba(7,59,107,.10);
            border-radius:999px;
            color:var(--navy);
            font-size:12px;
            font-weight:800;
            box-shadow:0 8px 25px rgba(7,59,107,.06);
        }
        .eyebrow i{
            width:8px;height:8px;
            border-radius:50%;
            background:var(--gold);
            box-shadow:0 0 0 5px rgba(217,167,45,.14);
        }
        .hero h1{
            margin-top:20px;
            color:var(--navy);
            font-size:clamp(36px,5vw,62px);
            line-height:1.17;
            font-weight:900;
            letter-spacing:-1.5px;
        }
        .hero h1 span{
            color:var(--gold);
            display:block;
        }
        .hero-text{
            margin-top:18px;
            max-width:650px;
            color:#52677d;
            font-size:15px;
            line-height:2;
            font-weight:600;
        }
        .hero-actions{
            margin-top:28px;
            display:flex;
            gap:12px;
            flex-wrap:wrap;
        }
        .btn{
            border:0;
            display:inline-flex;
            justify-content:center;
            align-items:center;
            gap:9px;
            padding:13px 22px;
            border-radius:14px;
            font-size:13px;
            font-weight:800;
            cursor:pointer;
            transition:.25s;
        }
        .btn:hover{transform:translateY(-3px)}
        .btn-primary{
            color:#fff;
            background:linear-gradient(135deg,var(--gold),#c68c16);
            box-shadow:0 12px 28px rgba(217,167,45,.25);
        }
        .btn-secondary{
            color:var(--navy);
            background:rgba(255,255,255,.86);
            border:1px solid #d7e3ed;
            box-shadow:0 10px 25px rgba(7,59,107,.07);
        }

        .hero-badges{
            margin-top:30px;
            display:flex;
            gap:22px;
            flex-wrap:wrap;
        }
        .mini-badge{
            display:flex;
            align-items:center;
            gap:9px;
            color:#50657b;
            font-size:11.5px;
            font-weight:700;
        }
        .mini-icon{
            width:36px;height:36px;
            border-radius:12px;
            display:grid;
            place-items:center;
            background:#fff;
            border:1px solid #e1eaf1;
            color:var(--navy);
            box-shadow:0 7px 18px rgba(7,59,107,.06);
        }

        .hero-visual{
            min-height:430px;
            position:relative;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .visual-card{
            width:min(530px,100%);
            border-radius:30px;
            padding:10px;
            background:rgba(255,255,255,.50);
            border:1px solid rgba(255,255,255,.85);
            box-shadow:var(--shadow);
            backdrop-filter:blur(5px);
            transform:rotate(1deg);
        }
        .visual-card img{
            display:block;
            width:100%;
            height:390px;
            object-fit:contain;
            border-radius:24px;
            background:#fff;
        }
        .floating-card{
            position:absolute;
            bottom:5px;
            right:-5px;
            background:rgba(255,255,255,.93);
            border:1px solid rgba(7,59,107,.08);
            border-radius:18px;
            padding:14px 17px;
            box-shadow:0 15px 40px rgba(7,59,107,.15);
            display:flex;
            align-items:center;
            gap:12px;
        }
        [dir="ltr"] .floating-card{right:auto;left:-5px}
        .floating-number{
            font-size:21px;
            font-weight:900;
            color:var(--navy);
        }
        .floating-label{
            color:var(--muted);
            font-size:10px;
            font-weight:700;
        }

        /* ===== الأقسام ===== */
        .section{
            max-width:1120px;
            margin:0 auto 70px;
            padding:0 20px;
        }
        .section-head{
            text-align:center;
            margin-bottom:28px;
        }
        .section-kicker{
            color:var(--gold);
            font-size:11px;
            font-weight:900;
            letter-spacing:1px;
        }
        .section-title{
            color:var(--navy);
            font-size:28px;
            font-weight:900;
            margin-top:5px;
        }
        .section-desc{
            color:var(--muted);
            font-size:13px;
            max-width:650px;
            margin:8px auto 0;
            line-height:1.9;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:17px;
        }
        .card{
            background:rgba(255,255,255,.91);
            border:1px solid rgba(7,59,107,.08);
            border-radius:20px;
            padding:23px 20px;
            box-shadow:0 12px 32px rgba(7,59,107,.07);
            transition:.3s;
            position:relative;
            overflow:hidden;
        }
        .card::before{
            content:"";
            position:absolute;
            inset:0 0 auto 0;
            height:3px;
            background:var(--accent,var(--blue));
        }
        .card:hover{
            transform:translateY(-7px);
            box-shadow:0 20px 45px rgba(7,59,107,.13);
        }
        .card-icon{
            width:48px;height:48px;
            border-radius:15px;
            display:grid;
            place-items:center;
            font-size:21px;
            background:var(--soft,#eaf7fe);
            color:var(--accent,var(--blue));
            margin-bottom:16px;
        }
        .card h3{
            color:var(--navy);
            font-size:16px;
            font-weight:900;
            margin-bottom:7px;
        }
        .card p{
            color:var(--muted);
            font-size:12px;
            line-height:1.9;
            min-height:68px;
        }
        .card-link{
            display:inline-flex;
            align-items:center;
            gap:5px;
            margin-top:14px;
            color:var(--accent,var(--blue));
            font-size:11.5px;
            font-weight:900;
        }

        /* ===== شريط الوصول السريع ===== */
        .quick{
            max-width:1120px;
            margin:0 auto 70px;
            padding:0 20px;
        }
        .quick-box{
            background:linear-gradient(135deg,#073b6b,#0a5b91);
            border-radius:26px;
            padding:30px;
            color:#fff;
            position:relative;
            overflow:hidden;
            box-shadow:0 20px 50px rgba(7,59,107,.20);
        }
        .quick-box::before{
            content:"";
            position:absolute;
            width:260px;height:260px;
            border:1px solid rgba(255,255,255,.10);
            border-radius:50%;
            top:-150px;left:-70px;
        }
        .quick-head{
            position:relative;
            display:flex;
            justify-content:space-between;
            gap:20px;
            align-items:end;
            margin-bottom:22px;
        }
        .quick-head h2{font-size:22px;font-weight:900}
        .quick-head p{font-size:11px;opacity:.78;margin-top:3px}
        .quick-grid{
            position:relative;
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:12px;
        }
        .quick-item{
            background:rgba(255,255,255,.10);
            border:1px solid rgba(255,255,255,.13);
            border-radius:16px;
            padding:17px;
            display:flex;
            align-items:center;
            gap:12px;
            transition:.25s;
        }
        .quick-item:hover{background:rgba(255,255,255,.17);transform:translateY(-3px)}
        .quick-item .qicon{
            width:39px;height:39px;
            border-radius:12px;
            background:rgba(255,255,255,.13);
            display:grid;
            place-items:center;
            font-size:17px;
        }
        .quick-item strong{font-size:12px}
        .quick-item small{display:block;font-size:9.5px;opacity:.72;margin-top:2px}

        /* ===== رسالة المؤسسة ===== */
        .mission{
            max-width:1120px;
            margin:0 auto 70px;
            padding:0 20px;
        }
        .mission-box{
            background:rgba(255,255,255,.92);
            border:1px solid rgba(7,59,107,.08);
            border-radius:25px;
            box-shadow:var(--shadow);
            padding:38px;
            display:grid;
            grid-template-columns:1fr 1.4fr;
            gap:35px;
            align-items:center;
        }
        .mission-mark{
            color:var(--gold);
            font-size:13px;
            font-weight:900;
        }
        .mission h2{
            color:var(--navy);
            font-size:27px;
            font-weight:900;
            margin:6px 0 12px;
        }
        .mission p{
            color:var(--muted);
            font-size:13px;
            line-height:2;
        }
        .pill-list{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            justify-content:flex-start;
        }
        .pill{
            background:#f4f8fb;
            border:1px solid #e2ebf2;
            border-radius:999px;
            padding:9px 13px;
            color:#405970;
            font-size:11px;
            font-weight:800;
        }

        /* ===== Footer ===== */
        footer{
            background:#061f39;
            color:#fff;
            margin-top:30px;
            padding:35px 20px 22px;
        }
        .footer-inner{
            max-width:1120px;
            margin:auto;
            display:flex;
            justify-content:space-between;
            gap:25px;
            align-items:center;
        }
        .footer-brand strong{font-size:16px}
        .footer-brand p{
            color:rgba(255,255,255,.65);
            font-size:10.5px;
            margin-top:4px;
        }
        .footer-copy{
            color:rgba(255,255,255,.55);
            font-size:10px;
        }
        .gold-line{
            width:45px;height:3px;
            border-radius:5px;
            background:var(--gold);
            margin-top:9px;
        }

        /* ===== Animations / ظهور المحتويات عند الاختيار ===== */
        .reveal{opacity:0;transform:translateY(28px);transition:opacity .75s ease,transform .75s cubic-bezier(.22,.61,.36,1);}
        .reveal.revealed{opacity:1;transform:none;}
        .reveal-left{opacity:0;transform:translateX(35px);transition:opacity .8s ease,transform .8s cubic-bezier(.22,.61,.36,1);}
        .reveal-left.revealed{opacity:1;transform:none;}
        .reveal-scale{opacity:0;transform:scale(.94);transition:opacity .7s ease,transform .7s cubic-bezier(.22,.61,.36,1);}
        .reveal-scale.revealed{opacity:1;transform:scale(1);}
        .card.reveal:nth-child(2){transition-delay:.08s}.card.reveal:nth-child(3){transition-delay:.16s}.card.reveal:nth-child(4){transition-delay:.24s}
        .quick-item.reveal:nth-child(2){transition-delay:.07s}.quick-item.reveal:nth-child(3){transition-delay:.14s}.quick-item.reveal:nth-child(4){transition-delay:.21s}
        .page-transition{animation:pageIn .55s ease both;}
        @keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
        @media(prefers-reduced-motion:reduce){.reveal,.reveal-left,.reveal-scale{opacity:1;transform:none;transition:none}.page-transition{animation:none}}

        /* ===== Mobile ===== */
        @media(max-width:980px){
            .nav{gap:0}
            .nav a{padding:9px 8px;font-size:11px}
            .hero{grid-template-columns:1fr}
            .hero-copy{text-align:center;margin:auto}
            .hero-text{margin-inline:auto}
            .hero-actions,.hero-badges{justify-content:center}
            .hero-visual{min-height:350px}
            .cards{grid-template-columns:repeat(2,1fr)}
            .quick-grid{grid-template-columns:repeat(2,1fr)}
            .mission-box{grid-template-columns:1fr;text-align:center}
            .pill-list{justify-content:center}
        }

        @media(max-width:700px){
            .header-inner{min-height:68px;padding:8px 15px}
            .menu-toggle{display:block}
            .nav{
                display:none;
                position:absolute;
                top:68px;
                inset-inline:12px;
                background:rgba(255,255,255,.98);
                border:1px solid #e2eaf0;
                border-radius:18px;
                padding:10px;
                flex-direction:column;
                align-items:stretch;
                box-shadow:0 20px 45px rgba(7,59,107,.14);
            }
            .nav.open{display:flex}
            .nav li{width:100%}
            .nav a,.lang-btn{width:100%;justify-content:center}
            .lang-btn{margin-top:4px}
            .hero-wrap{
                min-height:auto;
                padding:55px 16px 35px;
            }
            .hero h1{font-size:36px}
            .hero-text{font-size:13px}
            .hero-visual{min-height:280px}
            .visual-card img{height:260px}
            .floating-card{right:4px}
            [dir="ltr"] .floating-card{right:auto;left:4px}
            .cards{grid-template-columns:1fr}
            .quick-grid{grid-template-columns:1fr}
            .mission-box{padding:28px 20px}
            .footer-inner{flex-direction:column;text-align:center}
            .gold-line{margin-inline:auto}
        }
    </style>
</head>

<body>
<div class="page-bg" aria-hidden="true"></div>

<header>
    <div class="header-inner">
        <a href="index.html" class="brand" aria-label="مؤسسة الرسالة">
            <img src="logoarrissalah.jpg" alt="شعار مؤسسة الرسالة" class="brand-logo">
            <div>
                <div class="brand-name" data-ar="مؤسسة الرسالة" data-fr="Groupe Scolaire Al Risala">مؤسسة الرسالة
