<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل القبلي - مؤسسة الرسالة للتعليم الخصوصي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .brand-container { display: flex; flex-direction: column; text-decoration: none; }
        .logo { font-size: 18px; font-weight: 900; color: #0284c7; }
        .sub-logo { font-size: 10px; font-weight: 600; color: #64748b; text-transform: uppercase; }

        .menu-toggle { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: #0284c7; }
        .nav-menu { display: flex; list-style: none; gap: 20px; align-items: center; }
        .nav-menu a { text-decoration: none; color: #475569; font-weight: 600; font-size: 14px; }

        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .register-box { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border-top: 4px solid #10b981; width: 100%; max-width: 500px; }
        .register-box h2 { font-size: 20px; color: #0f172a; margin-bottom: 8px; }
        .register-box p { font-size: 14px; color: #64748b; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #334155; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        
        .submit-reg { width: 100%; background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 15px; transition: 0.3s; }
        .submit-reg:hover { background: #059669; }
        .success-alert { display: none; margin-top: 15px; padding: 12px; background: #d1fae5; color: #065f46; border-radius: 6px; font-size: 14px; text-align: center; font-weight: 600; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .nav-menu { display: none; flex-direction: column; width: 100%; background: white; position: absolute; top: 70px; left: 0; padding: 20px; box-shadow: 0 5px 10px rgba(0,0,0,0.05); }
            .nav-menu.active { display: flex; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="brand-container">
            <div class="logo">مؤسسة الرسالة</div>
            <div class="sub-logo">للتعليم الخصوصي</div>
        </a>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <ul class="nav-menu" id="navMenu">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="login.html">فضاءات الدخول</a></li>
        </ul>
    </header>

    <div class="container">
        <section class="register-box">
            <h2>طلب تسجيل تلميذ جديد</h2>
            <p>يسعدنا انضمام عائلتكم إلى مؤسستنا. يرجى تعبئة البيانات أدناه لتقديم طلب الالتحاق:</p>
            
            <form id="registrationForm">
                <div class="form-group">
                    <label>الاسم الكامل للتلميذ</label>
                    <input type="text" id="regName" class="form-control" required placeholder="مثال: يوسف البدري">
                </div>
                <div class="form-group">
                    <label>المستوى الدراسي المطلوب</label>
                    <select id="regLevel" class="form-control">
                        <option value="التعليم الأولي">التعليم الأولي</option>
                        <option value="السادس ابتدائي">السادس ابتدائي</option>
                        <option value="الأولى إعدادي">الأولى إعدادي</option>
                        <option value="الأولى باكالوريا">الأولى باكالوريا</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رقم هاتف ولي الأمر</label>
                    <input type="tel" id="regPhone" class="form-control" required placeholder="06XXXXXXXX">
                </div>
                <button type="submit" class="submit-reg">إرسال طلب التسجيل</button>
            </form>
            <div id="regSuccessMsg" class="success-alert">تم إرسال طلب التسجيل بنجاح! ستتواصل معك الإدارة قريباً.</div>
        </section>
    </div>

    <script>
        function toggleMenu() { document.getElementById('navMenu').classList.toggle('active'); }
        document.querySelectorAll('.nav-menu a').forEach(l => l.addEventListener('click', () => document.getElementById('navMenu').classList.remove('active')));

        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const _supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('regName').value;
            const level = document.getElementById('regLevel').value;
            const phone = document.getElementById('regPhone').value;

            if (!_supabase || SUPABASE_URL.includes('YOUR_PROJECT_ID')) {
                alert('الرجاء إعداد بيانات Supabase في الكود.');
                return;
            }

            const { error } = await _supabase
                .from('students')
                .insert([{ full_name: fullName, academic_level: level, parent_phone: phone, status: 'جديد' }]);

            if (error) {
                alert('خطأ: ' + error.message);
            } else {
                document.getElementById('regSuccessMsg').style.display = 'block';
                document.getElementById('registrationForm').reset();
            }
        });
    </script>
</body>
</html>
